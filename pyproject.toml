[project]
name = "bbkrpg"
version = "0.1.0"
description = "Format toolkit for BBK BBKRPG game archives (unpack, script disasm/asm, string tables)"
requires-python = ">=3.10"

[project.scripts]
bbkrpg = "bbkrpg.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bbkrpg"]
