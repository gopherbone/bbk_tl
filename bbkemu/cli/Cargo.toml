[package]
name = "bbkemu-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Agent-facing headless BBK A-series emulator: JSON-lines REPL over the BBKEmu core (gbemu-cli protocol)"

[[bin]]
name = "bbkemu"
path = "src/main.rs"

[dependencies]
bbkemu-core = { path = "../core" }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
